name: Sandforce
description: SandForce was a fabless semiconductor company (Canaan Partners-backed) that designed flash
  memory / SSD controller processors. It was acquired by LSI Corporation in 2012 and its flash-controller
  business was subsequently folded into Seagate; the sandforce.com domain now redirects to seagate.com.
  As a defunct, absorbed brand it operates no independent website, developer portal, API, SDK, or
  documentation, so there is no live API surface to enrich. Surfaced in the API Evangelist network as a
  canaan-partners portfolio lead; retained as a historical/company record.
